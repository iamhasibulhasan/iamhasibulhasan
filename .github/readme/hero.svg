<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">
<style>
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
</style>

<defs>
  <clipPath id="hero-clip"><rect width="1200" height="420" rx="24"/></clipPath>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4ade80"/>
    <stop offset="1" stop-color="#22c55e"/>
  </linearGradient>
</defs>
<g clip-path="url(#hero-clip)">
  <rect width="1200" height="420" fill="#0a0b09"/>
  
<defs>
  <pattern id="hero-p" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.05"/>
  </pattern>
  <radialGradient id="hero-fade" cx="0.85" cy="0.1" r="0.9">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="hero-m"><rect width="1200" height="420" fill="url(#hero-fade)"/></mask>
</defs>
<rect width="1200" height="420" fill="url(#hero-p)" mask="url(#hero-m)"/>
  
<defs>
  <radialGradient id="hero-glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#22c55e" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
  </radialGradient>
</defs>
<circle cx="1010" cy="60" r="420" fill="url(#hero-glow)">
  <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
</circle>
  
<defs>
  <radialGradient id="hero-glow2" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#22c55e" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
  </radialGradient>
</defs>
<circle cx="80" cy="430" r="260" fill="url(#hero-glow2)">
  <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
</circle>
</g>
<rect x="0.5" y="0.5" width="1199" height="419" rx="23.5" stroke="#252720"/>

<!-- status pill -->
<rect x="72" y="64" width="318" height="34" rx="17" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-opacity="0.35"/>
<circle cx="94" cy="81" r="9" fill="#22c55e" opacity="0.25">
  <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
</circle>
<circle cx="94" cy="81" r="4" fill="#22c55e"/>
<text class="mono" x="110" y="86" font-size="13" letter-spacing="1.6" fill="#4ade80">OPEN TO SOFTWARE ENGINEER ROLES</text>

<!-- name -->
<text class="sans" x="68" y="196" font-size="78" font-weight="700" letter-spacing="-2" fill="#f4f5f0">Hasibul <tspan fill="url(#name)">Hasan</tspan></text>

<!-- tagline -->
<text class="sans" x="72" y="250" font-size="24" fill="#9b9d90">Software Engineer building scalable backend</text>
<text class="sans" x="72" y="284" font-size="24" fill="#9b9d90">systems with <tspan fill="#f4f5f0" font-weight="600">.NET Core</tspan> and <tspan fill="#f4f5f0" font-weight="600">EF Core</tspan>.</text>

<!-- meta -->
<g class="mono" font-size="13" letter-spacing="1.4" fill="#9b9d90">
  <text x="72" y="356">DHAKA, BANGLADESH</text>
  <text x="250" y="356" fill="#252720">/</text>
  <text x="272" y="356">SOFTWARE ENGINEER</text>
  <text x="434" y="356" fill="#252720">/</text>
  <text x="456" y="356" fill="#4ade80">4.5+ YEARS</text>
</g>

<!-- code window -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="7s" repeatCount="indefinite"/>
  <rect x="752" y="64" width="384" height="292" rx="16" fill="#131410" stroke="#252720"/>
  <path d="M752 104H1136" stroke="#252720"/>
  <circle cx="776" cy="84" r="5.5" fill="#3a3d33"/>
  <circle cx="796" cy="84" r="5.5" fill="#3a3d33"/>
  <circle cx="816" cy="84" r="5.5" fill="#22c55e"/>
  <text class="mono" x="1112" y="88" font-size="12" fill="#9b9d90" text-anchor="end">Engineer.cs</text>
  <text class="mono" x="784" y="142" font-size="14" xml:space="preserve"><tspan fill="#22c55e">var </tspan><tspan fill="#f4f5f0">engineer </tspan><tspan fill="#9b9d90">= </tspan><tspan fill="#22c55e">new </tspan><tspan fill="#86efac">Engineer</tspan></text>
<text class="mono" x="784" y="169" font-size="14" xml:space="preserve"><tspan fill="#9b9d90">{</tspan></text>
<text class="mono" x="784" y="196" font-size="14" xml:space="preserve"><tspan fill="#f4f5f0">    Name   </tspan><tspan fill="#9b9d90">= </tspan><tspan fill="#bef264">"Hasibul Hasan"</tspan><tspan fill="#9b9d90">,</tspan></text>
<text class="mono" x="784" y="223" font-size="14" xml:space="preserve"><tspan fill="#f4f5f0">    Stack  </tspan><tspan fill="#9b9d90">= [</tspan><tspan fill="#bef264">".NET"</tspan><tspan fill="#9b9d90">, </tspan><tspan fill="#bef264">"EF Core"</tspan><tspan fill="#9b9d90">, </tspan><tspan fill="#bef264">"SQL"</tspan><tspan fill="#9b9d90">],</tspan></text>
<text class="mono" x="784" y="250" font-size="14" xml:space="preserve"><tspan fill="#f4f5f0">    Focus  </tspan><tspan fill="#9b9d90">= </tspan><tspan fill="#bef264">"Scalable systems"</tspan><tspan fill="#9b9d90">,</tspan></text>
<text class="mono" x="784" y="277" font-size="14" xml:space="preserve"><tspan fill="#f4f5f0">    OpenTo </tspan><tspan fill="#9b9d90">= </tspan><tspan fill="#86efac">Roles</tspan><tspan fill="#9b9d90">.</tspan><tspan fill="#f4f5f0">SoftwareEngineer</tspan></text>
<text class="mono" x="784" y="304" font-size="14" xml:space="preserve"><tspan fill="#9b9d90">};</tspan></text>
  <rect x="806" y="310" width="8" height="2" fill="#22c55e">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</g>

</svg>
