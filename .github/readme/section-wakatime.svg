</style>

<defs>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22c55e" stop-opacity="0.7"/>
    <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
  </linearGradient>
</defs>
<text class="mono" x="2" y="22" font-size="13" letter-spacing="1.8" fill="#22c55e">05 / CODE TIME</text>
<text class="sans title" x="0" y="64" font-size="34" font-weight="700" letter-spacing="-0.5">Where my hours go</text>
<rect x="0" y="80" width="1200" height="2" fill="url(#rule)"/>

