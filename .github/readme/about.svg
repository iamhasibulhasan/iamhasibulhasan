<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" fill="none">
<style>
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
</style>

<defs><clipPath id="about-clip"><rect width="1200" height="330" rx="20"/></clipPath></defs>
<g clip-path="url(#about-clip)">
  <rect width="1200" height="330" fill="#131410"/>
  
<defs>
  <radialGradient id="about-glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#22c55e" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
  </radialGradient>
</defs>
<circle cx="0" cy="0" r="300" fill="url(#about-glow)">
  <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
</circle>
</g>
<rect x="0.5" y="0.5" width="1199" height="329" rx="19.5" stroke="#252720"/>
<text class="sans" x="48" y="80" font-size="21" fill="#f4f5f0">Software Engineer with 4.5+ years of experience</text>
