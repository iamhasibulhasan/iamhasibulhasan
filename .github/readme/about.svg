<text class="sans" x="48" y="148" font-size="21" fill="#f4f5f0">.NET Core and Entity Framework Core, and I bring</text>
<text class="sans" x="48" y="182" font-size="21" fill="#9b9d90">problem-solving, leadership, teamwork and</text>
<text class="sans" x="48" y="216" font-size="21" fill="#9b9d90">stakeholder collaboration to every project.</text>
<path d="M620 40V290" stroke="#252720"/>

<rect x="660" y="52" width="8" height="8" rx="2" fill="#22c55e"/>
